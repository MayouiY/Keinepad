name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./public/manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION package=$PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($MANIFEST_VERSION) / package.json ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Zip extension
        run: |
          cd dist
          zip -r -X "../keinepad-$VERSION.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: keinepad-${{ env.VERSION }}
          path: keinepad-${{ env.VERSION }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: keinepad-${{ env.VERSION }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
